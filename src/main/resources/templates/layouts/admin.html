<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root { --corp:#1e3a5f; --bg:#f1f5f9; }
        body { background: var(--bg); }
        .sidebar { width: 240px; min-height: 100vh; background: linear-gradient(180deg,#0f172a,#1e3a5f); color:#fff; position: fixed; }
        .sidebar a { color: rgba(255,255,255,.85); text-decoration: none; display: block; padding: .55rem 1rem; border-radius: 8px; margin: .15rem .6rem; }
        .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,.12); color:#fff; }
        .main { margin-left: 240px; }
        .topbar { background:#fff; border-bottom:1px solid #e2e8f0; padding:.75rem 1.25rem; }
        .page-hero { background: linear-gradient(135deg,#1e3a5f,#0f172a); color:#fff; border-radius:12px; padding:1.25rem 1.5rem; margin-bottom:1.25rem; }
        .panel { background:#fff; border:1px solid #e2e8f0; border-radius:12px; overflow:hidden; margin-bottom:1rem; }
        .panel-header { padding:.75rem 1rem; border-bottom:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center; }
        .panel-header h2 { font-size:1rem; margin:0; }
        .panel-body.has-pad { padding:1rem; }
        .data-table { width:100%; }
        .data-table th, .data-table td { padding:.65rem 1rem; border-bottom:1px solid #f1f5f9; font-size:.9rem; }
        .data-table th { background:#f8fafc; text-transform:uppercase; font-size:.72rem; color:#64748b; }
        .btn-corp { background:var(--corp); color:#fff; border:none; }
        .btn-corp:hover { background:#152a45; color:#fff; }
        .kpi-card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:1rem; border-left:4px solid var(--corp); }
        .kpi-label { font-size:.75rem; color:#64748b; text-transform:uppercase; }
        .kpi-value { font-size:1.5rem; font-weight:700; }
        .badge-status { font-size:.72rem; padding:.2rem .5rem; border-radius:999px; background:#e2e8f0; }
        .badge-status.success { background:#d1fae5; color:#065f46; }
        .badge-status.warning { background:#fef3c7; color:#92400e; }
        .badge-status.info { background:#dbeafe; color:#1e40af; }
    </style>
</head>
<body>
<aside class="sidebar p-3">
    <div class="fw-bold mb-3 px-2">CRM Generator</div>
    <a th:href="@{/}"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <div class="text-uppercase small text-white-50 px-2 mt-3 mb-1">Módulos</div>
    <th:block th:each="m : ${modulesNav}">
        <a th:href="@{'/crm/' + ${m.slug}}" th:text="${m.name}">Mod</a>
    </th:block>
    <div class="text-uppercase small text-white-50 px-2 mt-3 mb-1" sec:authorize="hasRole('ADMIN')">Admin</div>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/modules/create}"><i class="bi bi-grid-1x2"></i> Constructor</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}"><i class="bi bi-people"></i> Usuarios</a>
</aside>
<div class="main">
    <div class="topbar d-flex justify-content-between align-items-center">
        <div class="small text-muted">Spring Boot CRM</div>
        <div class="d-flex align-items-center gap-2">
            <span class="small text-muted" sec:authentication="name"></span>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="btn btn-sm btn-outline-secondary">Salir</button>
            </form>
        </div>
    </div>
    <div class="p-4">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:insert="${content}"></div>
    </div>
</div>
</body>
</html>
