<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Detalle negocio')}"></head>
<body>
<th:block th:replace="~{fragments :: sidebar(${modulesNav})}"></th:block>
<div class="main">
    <th:block th:replace="~{fragments :: topbar}"></th:block>
    <div class="p-4">
        <div class="page-hero d-flex justify-content-between">
            <div>
                <h1 class="h3 mb-1" th:text="${tenant.name}">Negocio</h1>
                <p class="mb-0 opacity-75" th:text="${tenant.email}">email</p>
            </div>
            <div class="d-flex gap-2">
                <form th:action="@{'/admin/tenants/' + ${tenant.id} + '/enter'}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="btn btn-corp btn-sm">Entrar a este negocio</button>
                </form>
                <a th:href="@{/admin/tenants}" class="btn btn-outline-secondary btn-sm">Volver</a>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-6">
                <div class="panel">
                    <div class="panel-header"><h2>Usuarios</h2></div>
                    <table class="data-table">
                        <thead><tr><th>Nombre</th><th>Email</th><th>Rol</th></tr></thead>
                        <tbody>
                        <tr th:each="u : ${users}">
                            <td th:text="${u.name}">n</td>
                            <td th:text="${u.email}">e</td>
                            <td th:text="${u.role}">r</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}"><td colspan="3" class="text-muted text-center">Sin usuarios</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="panel">
                    <div class="panel-header"><h2>Módulos del negocio</h2></div>
                    <table class="data-table">
                        <thead><tr><th>Nombre</th><th>Slug</th><th>Tipo</th></tr></thead>
                        <tbody>
                        <tr th:each="m : ${modules}">
                            <td th:text="${m.name}">n</td>
                            <td><code th:text="${m.slug}">s</code></td>
                            <td th:text="${m.type}">t</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(modules)}"><td colspan="3" class="text-muted text-center">Sin módulos</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
