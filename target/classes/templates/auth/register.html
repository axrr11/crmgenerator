<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta · CRM Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary:#3b82f6; --primary-dark:#2563eb; --border:#e2e8f0; --text:#0f172a; --muted:#64748b; }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; font-family:Inter,system-ui,sans-serif; background:#f0f2f5; display:flex; }
        .split { display:flex; width:100%; min-height:100vh; }
        .brand-panel {
            flex:1.05; background:linear-gradient(160deg,#1e293b 0%,#0f172a 55%,#1e3a5f 100%);
            color:#fff; padding:48px; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden;
        }
        .brand-panel::after {
            content:""; position:absolute; width:420px; height:420px; border-radius:50%;
            background:radial-gradient(circle,rgba(59,130,246,.35),transparent 70%); top:-80px; right:-100px;
        }
        .logo { font-weight:700; font-size:18px; position:relative; z-index:1; }
        .brand-copy { position:relative; z-index:1; max-width:420px; }
        .brand-copy h1 { font-size:30px; font-weight:700; letter-spacing:-.03em; margin:0 0 12px; }
        .brand-copy p { color:#94a3b8; font-size:14.5px; line-height:1.6; margin:0; }
        .form-panel { flex:.95; display:flex; align-items:center; justify-content:center; padding:40px 24px; background:#f8fafc; }
        .card-box {
            width:100%; max-width:440px; background:#fff; border:1px solid var(--border);
            border-radius:16px; padding:32px; box-shadow:0 4px 24px rgba(15,23,42,.06);
        }
        h2 { margin:0 0 6px; font-size:22px; font-weight:700; color:var(--text); }
        .subtitle { color:var(--muted); font-size:14px; margin-bottom:22px; }
        label { display:block; font-size:13px; font-weight:600; color:#334155; margin-bottom:6px; }
        .form-control {
            width:100%; border:1px solid var(--border); border-radius:10px; padding:11px 14px;
            font-size:14px; margin-bottom:14px; background:#fff;
        }
        .form-control:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(59,130,246,.15); }
        .btn-main {
            width:100%; border:none; border-radius:10px; padding:12px; font-size:14px; font-weight:600;
            color:#fff; background:var(--primary); box-shadow:0 4px 14px rgba(59,130,246,.35); cursor:pointer; margin-top:6px;
        }
        .btn-main:hover { background:var(--primary-dark); }
        .alert { border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:14px; border:none; }
        .alert-danger { background:#fef2f2; color:#b91c1c; }
        .foot { margin-top:18px; text-align:center; font-size:13px; color:var(--muted); }
        .foot a { color:var(--primary); font-weight:600; text-decoration:none; }
        @media (max-width:900px){ .brand-panel{display:none;} .form-panel{flex:1;} }
    </style>
</head>
<body>
<div class="split">
    <div class="brand-panel">
        <div class="logo">CRM Generator</div>
        <div class="brand-copy">
            <h1>Registra tu negocio y empieza en minutos</h1>
            <p>Crea tu cuenta como Dueño, configura módulos y agrega a tu equipo. Cada negocio tiene sus datos aislados.</p>
        </div>
        <div style="position:relative;z-index:1;font-size:12px;color:#64748b">Multi-negocio · Spring Boot</div>
    </div>
    <div class="form-panel">
        <div class="card-box">
            <h2>Crear cuenta</h2>
            <p class="subtitle">Registra tu negocio y usuario administrador</p>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <form th:action="@{/register}" method="post">
                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <label>Nombre del negocio</label>
                <input name="business_name" class="form-control" required th:value="${business_name}" placeholder="Ej. Tienda Moda Norte">
                <label>Tu nombre</label>
                <input name="owner_name" class="form-control" required th:value="${owner_name}" placeholder="Nombre completo">
                <label>Email</label>
                <input type="email" name="email" class="form-control" required th:value="${email}" placeholder="tu@empresa.com">
                <label>Teléfono (opcional)</label>
                <input name="phone" class="form-control" th:value="${phone}" placeholder="+54 ...">
                <label>Contraseña</label>
                <input type="password" name="password" class="form-control" required minlength="6" placeholder="Mínimo 6 caracteres">
                <label>Confirmar contraseña</label>
                <input type="password" name="password_confirm" class="form-control" required minlength="6">
                <button type="submit" class="btn-main">Crear mi negocio</button>
            </form>
            <div class="foot">
                ¿Ya tienes cuenta? <a th:href="@{/login}">Ingresar</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
