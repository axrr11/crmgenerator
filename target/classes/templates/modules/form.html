<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${isEdit} ? 'Editar' : 'Crear')}"></head>
<body>
<th:block th:replace="~{fragments :: sidebar(${modulesNav})}"></th:block>
<div class="main">
    <th:block th:replace="~{fragments :: topbar}"></th:block>
    <div class="p-4">
        <div class="page-hero d-flex justify-content-between align-items-start flex-wrap gap-2">
            <div>
                <div class="small text-muted mb-1" th:text="${module.name}">Módulo</div>
                <h1 class="h3 mb-0" th:text="${isEdit} ? 'Editar registro' : 'Nuevo registro'">Form</h1>
            </div>
            <a th:href="@{'/crm/' + ${module.slug}}" class="btn btn-outline-secondary btn-sm">← Volver al listado</a>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="panel form-shell">
            <div class="panel-header">
                <h2 th:text="${isEdit} ? 'Datos del registro' : 'Complete los campos'">Datos</h2>
                <span class="badge-status info" th:text="${module.type}">catalog</span>
            </div>
            <div class="panel-body has-pad">
                <form th:action="${isEdit} ? @{'/crm/' + ${module.slug} + '/' + ${item['id']}} : @{'/crm/' + ${module.slug}}"
                      method="post" class="crm-form" id="main-form" enctype="multipart/form-data" novalidate>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="row g-3">
                        <div class="col-md-6" th:if="${clients != null}">
                            <label class="form-label">Cliente <span class="text-danger">*</span></label>
                            <select name="cliente_id" class="form-select form-select-lg" required>
                                <option value="">Seleccione un cliente…</option>
                                <option th:each="c : ${clients}"
                                        th:value="${c['id']}"
                                        th:text="${c['nombre'] != null ? c['nombre'] : ('#' + c['id'])}"
                                        th:selected="${item['cliente_id'] != null and #strings.equals(#strings.toString(item['cliente_id']), #strings.toString(c['id']))}"></option>
                            </select>
                        </div>

                        <div class="col-md-6" th:if="${products != null}">
                            <label class="form-label">Producto</label>
                            <select name="producto_id" id="product-select" class="form-select form-select-lg">
                                <option value="">Seleccione un producto…</option>
                                <option th:each="p : ${products}"
                                        th:value="${p['id']}"
                                        th:attr="data-nombre=${p['nombre']},data-precio=${p['precio']}"
                                        th:text="${p['nombre'] + (p['precio'] != null ? ' — $' + p['precio'] : '')}"
                                        th:selected="${item['producto_id'] != null and #strings.equals(#strings.toString(item['producto_id']), #strings.toString(p['id']))}"></option>
                            </select>
                        </div>

                        <div th:each="f : ${module.fields}"
                             th:class="${f['type'] == 'text'} ? 'col-12' : 'col-md-6'">
                            <label class="form-label">
                                <span th:text="${f['label']}">Campo</span>
                                <span class="text-danger" th:if="${f['required'] == true or f['required'] == 1}">*</span>
                            </label>

                            <!-- SELECT / SIZE -->
                            <select th:if="${f['type'] == 'select' or f['type'] == 'size'}" th:name="${f['name']}" class="form-select form-select-lg"
                                    th:required="${f['required'] == true or f['required'] == 1}">
                                <option value="">Seleccione…</option>
                                <option th:each="o : ${f['options']}" th:value="${o}" th:text="${o}"
                                        th:selected="${item[f['name']] != null and #strings.equals(#strings.toString(item[f['name']]), #strings.toString(o))}"></option>
                                <th:block th:if="${f['type'] == 'size' and (f['options'] == null or #lists.isEmpty(f['options']))}">
                                    <option value="XS">XS</option>
                                    <option value="S">S</option>
                                    <option value="M">M</option>
                                    <option value="L">L</option>
                                    <option value="XL">XL</option>
                                    <option value="XXL">XXL</option>
                                    <option value="Único">Único</option>
                                </th:block>
                            </select>

                            <textarea th:if="${f['type'] == 'text'}" th:name="${f['name']}" class="form-control form-control-lg" rows="4"
                                      th:placeholder="'Ingrese ' + ${f['label']}"
                                      th:required="${f['required'] == true or f['required'] == 1}"
                                      th:text="${item[f['name']]}"></textarea>

                            <!-- COLOR -->
                            <div th:if="${f['type'] == 'color'}" class="d-flex align-items-center gap-3">
                                <input type="color" th:name="${f['name']}" class="form-control form-control-color"
                                       th:value="${item[f['name']] != null ? item[f['name']] : '#3b82f6'}"
                                       style="width:60px;height:42px;padding:4px">
                                <span class="text-muted small" th:text="${item[f['name']]} ?: 'Elige un color'">#</span>
                            </div>

                            <!-- IMAGE -->
                            <div th:if="${f['type'] == 'image'}">
                                <input type="file" th:name="${f['name']}" class="form-control form-control-lg" accept="image/*"
                                       th:required="${(f['required'] == true or f['required'] == 1) and (item[f['name']] == null or item[f['name']] == '')}">
                                <div class="form-text">JPG, PNG, WEBP o GIF · máx. 5 MB</div>
                                <div th:if="${item[f['name']] != null}" class="mt-2">
                                    <img th:src="${item[f['name']]}" alt="actual" style="max-height:80px;border-radius:8px;border:1px solid #e2e8f0">
                                </div>
                            </div>

                            <input th:if="${f['type'] != 'select' and f['type'] != 'size' and f['type'] != 'text' and f['type'] != 'boolean' and f['type'] != 'color' and f['type'] != 'image'}"
                                   th:type="${f['type'] == 'integer' or f['type'] == 'decimal' ? 'number' : (f['type'] == 'email' ? 'email' : (f['type'] == 'date' ? 'date' : (f['type'] == 'datetime' ? 'datetime-local' : (f['type'] == 'phone' ? 'tel' : 'text'))))}"
                                   th:name="${f['name']}" class="form-control form-control-lg"
                                   th:value="${item[f['name']]}" th:placeholder="'Ingrese ' + ${f['label']}"
                                   th:required="${f['required'] == true or f['required'] == 1}"
                                   th:attr="min=${(f['type'] == 'integer' or f['type'] == 'decimal') ? '0' : null},
                                            step=${f['type'] == 'decimal' ? '0.01' : (f['type'] == 'integer' ? '1' : null)}">

                            <div th:if="${f['type'] == 'boolean'}" class="form-check form-switch mt-2">
                                <input type="checkbox" class="form-check-input" role="switch"
                                       th:name="${f['name']}" value="true"
                                       th:checked="${item[f['name']] == true or item[f['name']] == 1 or item[f['name']] == 'true'}">
                                <label class="form-check-label text-muted">Activar</label>
                            </div>
                        </div>

                        <!-- Cuotas con fechas individuales -->
                        <div class="col-12" th:if="${module.type == 'sales' and !isEdit}">
                            <div class="panel mb-0" style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px">
                                <div class="panel-body has-pad">
                                    <h3 class="h6 mb-3">Forma de pago</h3>
                                    <div class="row g-3">
                                        <div class="col-md-4">
                                            <label class="form-label">Modalidad</label>
                                            <select name="pay_mode" id="pay-mode" class="form-select">
                                                <option value="contado">Contado / pago único</option>
                                                <option value="cuotas">En cuotas</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4 cuota-only d-none">
                                            <label class="form-label">Nº de cuotas</label>
                                            <input type="number" name="installments" id="installments" class="form-control" min="2" max="24" value="3">
                                        </div>
                                        <div class="col-12 cuota-only d-none">
                                            <label class="form-label">Fecha de cada cuota</label>
                                            <div id="due-dates" class="row g-2"></div>
                                            <div class="form-text">Define la fecha de vencimiento de cada cuota.</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Dueño: automático o select solo creator/owner -->
                        <div class="col-md-6" th:if="${module.hasOwner}">
                            <label class="form-label">Dueño del registro</label>
                            <div th:if="${canAssignOwner}">
                                <select name="owner_id" class="form-select form-select-lg">
                                    <option value="" th:if="${currentUser != null}"
                                            th:value="${currentUser.id}"
                                            th:text="${'Yo · ' + currentUser.name}"
                                            th:selected="${item['owner_id'] == null}"></option>
                                    <option th:each="u : ${users}"
                                            th:value="${u['id']}"
                                            th:text="${u['name'] + ' (' + u['email'] + ')'}"
                                            th:selected="${item['owner_id'] != null and #strings.equals(#strings.toString(item['owner_id']), #strings.toString(u['id']))}"></option>
                                </select>
                                <div class="form-text">Como Creador/Dueño puedes reasignar el registro.</div>
                            </div>
                            <div th:if="${!canAssignOwner}">
                                <input type="text" class="form-control form-control-lg" disabled
                                       th:value="${currentUser != null ? currentUser.name : 'Usuario actual'}">
                                <div class="form-text">Se asignará automáticamente a tu usuario.</div>
                            </div>
                        </div>
                    </div>

                    <hr class="my-4">
                    <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center">
                        <a th:href="@{'/crm/' + ${module.slug}}" class="btn btn-outline-secondary btn-lg">Cancelar</a>
                        <button type="submit" class="btn btn-corp btn-lg px-4">
                            <i class="bi bi-check2-circle"></i>
                            <span th:text="${isEdit} ? 'Guardar cambios' : 'Crear registro'">Guardar</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
(function () {
  var sel = document.getElementById('product-select');
  if (sel) {
    sel.addEventListener('change', function () {
      var opt = sel.options[sel.selectedIndex];
      if (!opt || !opt.value) return;
      var nombre = opt.getAttribute('data-nombre') || '';
      var precio = opt.getAttribute('data-precio') || '';
      var title = document.querySelector('input[name="titulo"]');
      var total = document.querySelector('input[name="total"]');
      if (title && nombre) title.value = nombre;
      if (total && precio !== '') total.value = precio;
    });
  }

  var mode = document.getElementById('pay-mode');
  var nInput = document.getElementById('installments');
  var box = document.getElementById('due-dates');

  function addMonths(d, m) {
    var x = new Date(d.getTime());
    x.setMonth(x.getMonth() + m);
    return x;
  }
  function fmt(d) {
    return d.toISOString().slice(0, 10);
  }
  function renderDates() {
    if (!box || !nInput) return;
    var n = parseInt(nInput.value, 10) || 0;
    if (n < 2) n = 2;
    if (n > 24) n = 24;
    var html = '';
    var base = new Date();
    base.setMonth(base.getMonth() + 1);
    for (var i = 0; i < n; i++) {
      var d = addMonths(base, i);
      html += '<div class="col-md-3 col-6">' +
        '<label class="form-label small">Cuota ' + (i + 1) + '</label>' +
        '<input type="date" name="due_dates" class="form-control form-control-sm" value="' + fmt(d) + '" required>' +
        '</div>';
    }
    box.innerHTML = html;
  }
  function syncCuotas() {
    var on = mode && mode.value === 'cuotas';
    document.querySelectorAll('.cuota-only').forEach(function (el) {
      el.classList.toggle('d-none', !on);
    });
    if (on) renderDates();
  }
  if (mode) {
    mode.addEventListener('change', syncCuotas);
    if (nInput) nInput.addEventListener('change', renderDates);
    if (nInput) nInput.addEventListener('input', renderDates);
    syncCuotas();
  }
})();
</script>
</body>
</html>
