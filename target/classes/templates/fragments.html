<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/javafx-modena.css}" rel="stylesheet">
</th:block>

<th:block th:fragment="sidebar(modulesNav)">
<aside class="sidebar">
    <div class="brand">
        CRM Generator
        <small th:if="${currentTenant != null}" th:text="${currentTenant.name}">Negocio</small>
        <small th:if="${currentTenant == null and isPlatformAdmin}">Plataforma</small>
    </div>

    <a th:href="@{/}" th:classappend="${currentPath == '/' or currentPath == ''} ? ' active' : ''">
        <i class="bi bi-speedometer2"></i> Dashboard
    </a>

    <!-- Módulos de negocio: solo si hay tenant de trabajo (dueño/usuario o creator "dentro") -->
    <th:block th:if="${modulesNav != null and !#lists.isEmpty(modulesNav)}">
        <div class="nav-section">Módulos</div>
        <a th:each="m : ${modulesNav}"
           th:href="@{'/crm/' + ${m.slug}}"
           th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/crm/' + m.slug)} ? ' active' : ''">
            <i class="bi bi-folder2"></i>
            <span th:text="${m.name}">Mod</span>
        </a>
    </th:block>

    <!-- Admin del negocio (dueño) o creator dentro de un negocio -->
    <th:block sec:authorize="hasAnyRole('ADMIN','CREATOR','OWNER')" th:if="${!isPlatformAdmin or viewingAsTenant}">
        <div class="nav-section">Administración</div>
        <a th:href="@{/admin/modules}"
           th:classappend="${currentPath == '/admin/modules'} ? ' active' : ''">
            <i class="bi bi-collection"></i> Módulos
        </a>
        <a th:href="@{/admin/modules/create}"
           th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/admin/modules/create')} ? ' active' : ''">
            <i class="bi bi-grid-1x2"></i> Constructor
        </a>
        <a th:href="@{/admin/users}"
           th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/admin/users')} ? ' active' : ''">
            <i class="bi bi-people"></i> Usuarios
        </a>
    </th:block>

    <!-- Solo Creador (plataforma) -->
    <th:block th:if="${isPlatformAdmin}">
        <div class="nav-section">Plataforma</div>
        <a th:href="@{/admin/tenants}"
           th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/admin/tenants')} ? ' active' : ''">
            <i class="bi bi-building"></i> Negocios
        </a>
        <form th:if="${viewingAsTenant}" th:action="@{/admin/tenants/exit}" method="post" class="px-3 mt-2">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="btn btn-sm btn-outline-light w-100">Salir del negocio</button>
        </form>
    </th:block>
</aside>
</th:block>

<th:block th:fragment="topbar">
<div class="topbar">
    <div class="small">
        <span th:if="${viewingAsTenant and currentTenant != null}">
            Viendo: <strong th:text="${currentTenant.name}">Negocio</strong>
        </span>
        <span th:if="${!viewingAsTenant and currentTenant != null}" th:text="${currentTenant.name}">Negocio</span>
        <span th:if="${currentTenant == null and isPlatformAdmin}">Panel plataforma</span>
        <span th:if="${currentTenant == null and !isPlatformAdmin}">CRM Generator</span>
    </div>
    <div class="d-flex align-items-center gap-2">
        <span class="small text-muted" th:if="${currentUserAccount != null}" th:text="${currentUserAccount.role}">role</span>
        <span class="small" sec:authentication="name"></span>
        <form th:action="@{/logout}" method="post" class="m-0">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="btn btn-sm">Salir</button>
        </form>
    </div>
</div>
</th:block>
</body>
</html>
