<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Editar módulo')}"></head>
<body>
<th:block th:replace="~{fragments :: sidebar(${modulesNav})}"></th:block>
<div class="main">
    <th:block th:replace="~{fragments :: topbar}"></th:block>
    <div class="p-4">
        <div class="page-hero d-flex justify-content-between align-items-start">
            <div>
                <h1 class="h3 mb-1" th:text="'Editar · ' + ${mod.name}">Editar</h1>
                <p class="mb-0 opacity-75"><code th:text="${mod.slug}"></code> · <span th:text="${mod.type}"></span></p>
            </div>
            <a th:href="@{/admin/modules}" class="btn btn-outline-secondary btn-sm">← Volver</a>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="row g-4">
            <div class="col-lg-5">
                <div class="panel">
                    <div class="panel-header"><h2>Datos generales</h2></div>
                    <div class="panel-body has-pad">
                        <form th:action="@{'/admin/modules/' + ${mod.slug} + '/edit'}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input name="name" class="form-control" th:value="${mod.name}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <input name="description" class="form-control" th:value="${mod.description}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Tabla</label>
                                <input class="form-control" th:value="${mod.tableName}" disabled>
                            </div>
                            <button class="btn btn-corp">Guardar cambios</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="panel">
                    <div class="panel-header"><h2>Campos actuales</h2></div>
                    <table class="data-table">
                        <thead><tr><th>Nombre</th><th>Etiqueta</th><th>Tipo</th><th>Req.</th></tr></thead>
                        <tbody>
                        <tr th:each="f : ${mod.fields}">
                            <td><code th:text="${f['name']}"></code></td>
                            <td th:text="${f['label']}"></td>
                            <td><span class="badge-status info" th:text="${f['type']}"></span></td>
                            <td th:text="${f['required'] == true or f['required'] == 1} ? 'Sí' : 'No'"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="panel">
                    <div class="panel-header"><h2>Agregar campo</h2></div>
                    <div class="panel-body has-pad">
                        <form th:action="@{'/admin/modules/' + ${mod.slug} + '/fields'}" method="post" class="row g-2 align-items-end">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <div class="col-md-3">
                                <label class="form-label">Nombre columna</label>
                                <input name="field_name" class="form-control" required pattern="[a-zA-Z][a-zA-Z0-9_]*" placeholder="ciudad">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Etiqueta</label>
                                <input name="field_label" class="form-control" required placeholder="Ciudad">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Tipo</label>
                                <select name="field_type" class="form-select">
                                    <option th:each="t : ${fieldTypes}" th:value="${t.name().toLowerCase()}" th:text="${t.label()}"></option>
                                </select>
                            </div>
                            <div class="col-md-1">
                                <div class="form-check mt-4">
                                    <input type="checkbox" name="field_required" value="1" class="form-check-input" id="freq">
                                    <label for="freq" class="form-check-label small">Req</label>
                                </div>
                            </div>
                            <div class="col-md-2">
                                <button class="btn btn-corp w-100">Agregar</button>
                            </div>
                        </form>
                        <p class="form-text mt-2 mb-0">Se ejecuta ALTER TABLE y se actualiza el formulario del módulo.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
