<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Usuarios')}"></head>
<body>
<th:block th:replace="~{fragments :: sidebar(${modulesNav})}"></th:block>
<div class="main">
    <th:block th:replace="~{fragments :: topbar}"></th:block>
    <div class="p-4">
        <div class="page-hero d-flex justify-content-between">
            <h1 class="h3 mb-0">Usuarios</h1>
            <a th:href="@{/admin/users/create}" class="btn btn-light btn-sm">+ Nuevo</a>
        </div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div class="panel">
            <table class="data-table">
                <thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th></th></tr></thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.name}">n</td>
                    <td th:text="${u.email}">e</td>
                    <td>
                        <span class="badge-status info" th:switch="${u.role}">
                            <span th:case="'creator'">Creador</span>
                            <span th:case="'admin'">Creador</span>
                            <span th:case="'owner'">Dueño</span>
                            <span th:case="'visitor'">Visitante</span>
                            <span th:case="'viewer'">Visitante</span>
                            <span th:case="*">Usuario</span>
                        </span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{'/admin/users/' + ${u.id} + '/edit'}" class="btn btn-sm btn-outline-primary">Editar</a>
                        <form th:action="@{'/admin/users/' + ${u.id} + '/delete'}" method="post" class="d-inline"
                              onsubmit="return confirm('¿Eliminar usuario?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="btn btn-sm btn-outline-danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
