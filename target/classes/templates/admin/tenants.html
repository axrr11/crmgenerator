<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Negocios')}"></head>
<body>
<th:block th:replace="~{fragments :: sidebar(${modulesNav})}"></th:block>
<div class="main">
    <th:block th:replace="~{fragments :: topbar}"></th:block>
    <div class="p-4">
        <div class="page-hero d-flex justify-content-between align-items-start flex-wrap gap-2">
            <div>
                <h1 class="h3 mb-1">Negocios registrados</h1>
                <p class="mb-0 opacity-75">Panel del Creador · aislamiento multi-tenant</p>
            </div>
            <form th:if="${viewTenantId != null}" th:action="@{/admin/tenants/exit}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="btn btn-outline-secondary btn-sm">Salir del negocio actual</button>
            </form>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="panel">
            <table class="data-table">
                <thead>
                <tr>
                    <th>Negocio</th>
                    <th>Estado</th>
                    <th>Usuarios</th>
                    <th>Módulos</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${tenantRows}">
                    <td>
                        <strong th:text="${row['tenant'].name}">Nombre</strong>
                        <div class="small text-muted" th:text="${row['tenant'].slug}"></div>
                        <div class="small text-muted" th:text="${row['tenant'].email}"></div>
                    </td>
                    <td>
                        <span class="badge-status"
                              th:classappend="${row['tenant'].status == 'active'} ? ' success' : ' warning'"
                              th:text="${row['tenant'].status}">active</span>
                    </td>
                    <td>
                        <div th:text="${row['userCount']} + ' usuario(s)'">0</div>
                        <div class="small text-muted" th:each="u : ${row['users']}" th:text="${u.name + ' · ' + u.role}">u</div>
                    </td>
                    <td th:text="${row['moduleCount']}">0</td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{'/admin/tenants/' + ${row['tenant'].id}}" class="btn btn-sm btn-outline-secondary">Detalle</a>
                        <form th:action="@{'/admin/tenants/' + ${row['tenant'].id} + '/enter'}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="btn btn-sm btn-corp"
                                    th:text="${viewTenantId != null and viewTenantId == row['tenant'].id} ? 'En este negocio' : 'Entrar'">Entrar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(tenantRows)}">
                    <td colspan="5" class="text-center text-muted p-4">No hay negocios registrados</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
